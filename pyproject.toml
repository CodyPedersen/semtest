[project]
name = "semtest"
version = "0.0.1"
description = "LLM semantic testing and benchmarking framework"
readme = "README.md"
authors = [{ name = "Cody Pedersen"}]
requires-python = ">=3.12"
dependencies = [
    "mypy>=1.16.1",
    "numpy==2.1.1",
    "openai==1.44.0",
    "pandas==2.2.2",
    "pydantic==2.9.0",
    "pydantic-settings==2.4.0",
    "pylint>=3.3.7",
    "pytest>=8.2.0",
    "pytest-env>=1.1.3",
    "scikit-learn==1.5.1",
    "tabulate==0.9.0",
    "termcolor==2.4.0",
]

[dependency-groups]
dev = [
    "ipykernel==6.29.5",
    "pylint-pytest>=1.1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
exclude = [
    "example_benchmarks/",
    "tests/",
    "*.pyc",
    "__pycache__/",
]

[tool.mypy]
python_version = "3.12"
strict = true
disable_error_code = ["import-untyped", "prop-decorator"]
ignore_missing_imports = true
plugins=["pydantic.mypy"]

[tool.pylint.master]
load-plugins = ["pylint_pytest"]
py-version = "3.12"

[tool.pylint."messages control"]
disable = [
    "raw-checker-failed",
    "bad-inline-option",
    "locally-disabled",
    "file-ignored",
    "suppressed-message",
    "useless-suppression",
    "deprecated-pragma",
    "use-symbolic-message-instead",
    "use-implicit-booleaness-not-comparison-to-string",
    "use-implicit-booleaness-not-comparison-to-zero",
    "import-error",
    "too-few-public-methods",
    "fixme",
    "too-many-instance-attributes",
    "too-many-arguments",
    "logging-fstring-interpolation",
    "missing-module-docstring",
    "missing-function-docstring",
    "missing-class-docstring",
]

[tool.pytest_env]
OPENAI_API_KEY = ""
